[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-benefit-data"
version = "0.1.0"
description = "Discover entitlements and support by jurisdiction and eligibility."
requires-python = ">=3.10"
dependencies = ["jsonschema==4.19.2"]

[project.scripts]
book-benefit-data = "book_benefit_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
book_benefit_data = ["*.json"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.format]
# Vendored, byte-identical across the sibling book-*-data repos: cli.py is SHA-256 pinned by
# tests/test_shared_cli.py, which is itself copied unchanged to every sibling. Reformat them
# only together, in every sibling, with the pins updated.
exclude = ["src/*/cli.py", "tests/test_shared_cli.py"]

[tool.ruff.lint]
# Correctness-focused set; the compact adapter style (E7 one-line statements)
# is intentionally left alone.
select = ["E9", "F", "I", "UP", "B"]
